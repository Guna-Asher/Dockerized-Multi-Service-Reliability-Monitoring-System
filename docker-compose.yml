

services:
  nginx:
    image: nginx:latest
    container_name: nginx
    networks:
      - reliability-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: redis
    networks:
      - reliability-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  flask-app:
    build: ./flask-app
    container_name: flask-app
    networks:
      - reliability-net
    ports:
      - "8080:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  monitor-agent:
    build: ./monitor-agent
    container_name: monitor-agent
    volumes:
      - ./logs:/app/logs
      - ./reports:/app/reports
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - reliability-net
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
    restart: unless-stopped

networks:
  reliability-net:
    driver: bridge

volumes:
  logs:
  reports:

